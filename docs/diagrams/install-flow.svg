<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="966" viewBox="0 0 1200 966"><defs><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#117865"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6fb3"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52606d"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c77700"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b42318"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="30" y="20" width="1140" height="46" rx="10" fill="#fff4e0" stroke="#c77700" stroke-width="1.6"/><text x="48" y="48" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#6b3f00" font-weight="400" text-anchor="start"><tspan x="48" dy="0"><tspan font-family="ui-monospace,'DejaVu Sans Mono',Menlo,monospace" font-size="0.9em">npm run setup</tspan> writes local files only. <tspan font-family="ui-monospace,'DejaVu Sans Mono',Menlo,monospace" font-size="0.9em">setup:notebooks</tspan> imports by name. <tspan font-family="ui-monospace,'DejaVu Sans Mono',Menlo,monospace" font-size="0.9em">rayfin up</tspan> and <tspan font-family="ui-monospace,'DejaVu Sans Mono',Menlo,monospace" font-size="0.9em">rayfin secret set</tspan> are CLI commands.</tspan></text><rect x="50" y="86" width="26" height="14" rx="4" fill="#fff4e0" stroke="#c77700" stroke-width="1.6" stroke-dasharray="4 3"/><text x="84" y="98" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b7a" font-weight="400" text-anchor="start"><tspan x="84" dy="0">setup script or name lookup</tspan></text><rect x="300" y="86" width="26" height="14" rx="4" fill="#eaf1fb" stroke="#2f6fb3" stroke-width="1.6"/><text x="334" y="98" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b7a" font-weight="400" text-anchor="start"><tspan x="334" dy="0">existing Rayfin CLI command</tspan></text><rect x="570" y="86" width="26" height="14" rx="4" fill="#e7f5f2" stroke="#117865" stroke-width="1.6"/><text x="604" y="98" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b6b7a" font-weight="400" text-anchor="start"><tspan x="604" dy="0">the running app</tspan></text><rect x="50" y="118" width="1100" height="62" rx="10" fill="#ffffff" stroke="#9aa7b4" stroke-width="1.6" stroke-dasharray="6 4"/><text x="64" y="144" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#52606d" font-weight="700" text-anchor="start"><tspan x="64" dy="0">Before step 1</tspan></text><text x="66" y="164" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="66" dy="0">Tenant settings, a Fabric capacity, the ADLS account and container, and the app identity&#x27;s roles are set up first (sections 1 to 3 of this guide).</tspan></text><rect x="50" y="204" width="600" height="151" rx="10" fill="#fff4e0" stroke="#c77700" stroke-width="1.6" stroke-dasharray="7 4"/><circle cx="70" cy="222.68" r="11" fill="#c77700"/><text x="70" y="227.18" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#fff" font-weight="700" text-anchor="middle"><tspan x="70" dy="0">1</tspan></text><text x="90" y="230" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#6b3f00" font-weight="700" text-anchor="start"><tspan x="90" dy="0">npm run setup  (the wizard)</tspan></text><text x="90" y="249.75" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="90" dy="0">Asks for, with no network calls:</tspan><tspan x="90" dy="17.5">•  app title and icon (PNG)</tspan><tspan x="90" dy="17.5">•  notebook workspace</tspan><tspan x="90" dy="17.5">•  staging / control workspace + lakehouse</tspan><tspan x="90" dy="17.5">•  ADLS account, container and folder</tspan><tspan x="90" dy="17.5">•  admin UPNs or object ids (ADMIN_SUBJECTS)</tspan></text><path d="M350.0 355 L350.0 381" fill="none" stroke="#52606d" stroke-width="2" stroke-linejoin="round" marker-end="url(#arg)"/><rect x="50" y="381" width="600" height="98" rx="10" fill="#fff4e0" stroke="#c77700" stroke-width="1.6" stroke-dasharray="7 4"/><circle cx="70" cy="399.68" r="11" fill="#c77700"/><text x="70" y="404.18" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#fff" font-weight="700" text-anchor="middle"><tspan x="70" dy="0">2</tspan></text><text x="90" y="407" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#6b3f00" font-weight="700" text-anchor="start"><tspan x="90" dy="0">npm run setup:notebooks</tspan></text><text x="90" y="426.75" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="90" dy="0">Imports the 3 notebooks into the chosen notebook workspace,</tspan><tspan x="90" dy="17.5">by their exact names (the runners %run the engine by name):</tspan><tspan x="90" dy="17.5">nb_backup_restore_adls_v6, nb_backup_run, nb_restore_run</tspan></text><path d="M350.0 479 L350.0 505" fill="none" stroke="#52606d" stroke-width="2" stroke-linejoin="round" marker-end="url(#arg)"/><rect x="50" y="505" width="600" height="81" rx="10" fill="#eaf1fb" stroke="#2f6fb3" stroke-width="1.6"/><circle cx="70" cy="523.68" r="11" fill="#2f6fb3"/><text x="70" y="528.18" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#fff" font-weight="700" text-anchor="middle"><tspan x="70" dy="0">3</tspan></text><text x="90" y="531" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#2f6fb3" font-weight="700" text-anchor="start"><tspan x="90" dy="0">npx rayfin up   (first deploy)</tspan></text><text x="90" y="550.75" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="90" dy="0">Builds the UI and functions, creates the app item and hosts it.</tspan><tspan x="90" dy="17.5">${VAR} values in rayfin.yml come from rayfin/.env.</tspan></text><path d="M350.0 586 L350.0 612" fill="none" stroke="#52606d" stroke-width="2" stroke-linejoin="round" marker-end="url(#arg)"/><rect x="50" y="612" width="600" height="81" rx="10" fill="#eaf1fb" stroke="#2f6fb3" stroke-width="1.6"/><circle cx="70" cy="630.68" r="11" fill="#2f6fb3"/><text x="70" y="635.18" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#fff" font-weight="700" text-anchor="middle"><tspan x="70" dy="0">4</tspan></text><text x="90" y="638" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#2f6fb3" font-weight="700" text-anchor="start"><tspan x="90" dy="0">npx rayfin secret set --env-file rayfin/.env.secrets</tspan></text><text x="90" y="657.75" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="90" dy="0">Stores the IDs and ADLS values where the functions can read them.</tspan><tspan x="90" dy="17.5">Needs the app deployed first. The file stays gitignored.</tspan></text><path d="M350.0 693 L350.0 719" fill="none" stroke="#52606d" stroke-width="2" stroke-linejoin="round" marker-end="url(#arg)"/><rect x="50" y="719" width="600" height="98" rx="10" fill="#fff4e0" stroke="#c77700" stroke-width="1.6" stroke-dasharray="7 4"/><circle cx="70" cy="737.68" r="11" fill="#c77700"/><text x="70" y="742.18" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#fff" font-weight="700" text-anchor="middle"><tspan x="70" dy="0">5</tspan></text><text x="90" y="745" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#6b3f00" font-weight="700" text-anchor="start"><tspan x="90" dy="0">Functions read ctx.Secrets and find the notebooks by name</tspan></text><text x="90" y="764.75" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="90" dy="0">At run time the functions list the notebook workspace and look up</tspan><tspan x="90" dy="17.5">nb_backup_run and nb_restore_run by exact name, so notebook IDs</tspan><tspan x="90" dy="17.5">are never typed in or compiled into the code.</tspan></text><path d="M350.0 817 L350.0 843" fill="none" stroke="#52606d" stroke-width="2" stroke-linejoin="round" marker-end="url(#arg)"/><rect x="50" y="843" width="600" height="81" rx="10" fill="#e7f5f2" stroke="#117865" stroke-width="1.6"/><circle cx="70" cy="861.68" r="11" fill="#117865"/><text x="70" y="866.18" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#fff" font-weight="700" text-anchor="middle"><tspan x="70" dy="0">6</tspan></text><text x="90" y="869" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#117865" font-weight="700" text-anchor="start"><tspan x="90" dy="0">The app runs with no code edits</tspan></text><text x="90" y="888.75" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="90" dy="0">Open the hosting URL, sign in as an admin, pick a lakehouse and back it up.</tspan><tspan x="90" dy="17.5">Title and icon come from the setup step.</tspan></text><rect x="710" y="204" width="440" height="98" rx="10" fill="#ffffff" stroke="#9aa7b4" stroke-width="1.6"/><text x="724" y="230" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#52606d" font-weight="700" text-anchor="start"><tspan x="724" dy="0">rayfin/.env  (branding and port)</tspan></text><text x="724" y="249.75" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="724" dy="0">DEV_PORT is interpolated in rayfin.yml.</tspan><tspan x="724" dy="17.5">VITE_APP_TITLE, VITE_APP_SUBTITLE and VITE_APP_ICON</tspan><tspan x="724" dy="17.5">are read by the frontend build. Gitignored.</tspan></text><rect x="710" y="318" width="440" height="116" rx="10" fill="#ffffff" stroke="#9aa7b4" stroke-width="1.6"/><text x="724" y="344" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#52606d" font-weight="700" text-anchor="start"><tspan x="724" dy="0">rayfin/.env.secrets  (IDs and ADLS values)</tspan></text><text x="724" y="363.75" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="724" dy="0">NOTEBOOK_WORKSPACE_ID, STAGING_WORKSPACE_ID,</tspan><tspan x="724" dy="17.5">STAGING_LAKEHOUSE_ID, ADLS_ACCOUNT, ADLS_CONTAINER,</tspan><tspan x="724" dy="17.5">ADLS_ARCHIVE_FOLDER (- = container root), ADMIN_SUBJECTS.</tspan><tspan x="724" dy="17.5">Git-ignored. Apply with secret set; then you may delete it.</tspan></text><path d="M652 254 L708 254" fill="none" stroke="#52606d" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#arg)"/><path d="M652 354 L708 368" fill="none" stroke="#52606d" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#arg)"/><text x="660" y="248" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6b7a" font-weight="600" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan x="660" dy="0">writes</tspan></text><rect x="710" y="448" width="440" height="98" rx="10" fill="#ffffff" stroke="#9aa7b4" stroke-width="1.6"/><text x="724" y="474" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#52606d" font-weight="700" text-anchor="start"><tspan x="724" dy="0">Who runs it</tspan></text><text x="724" y="493.75" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="724" dy="0">The installer, signed in. They need a Contributor-level</tspan><tspan x="724" dy="17.5">role on the notebook workspace (only Contributor is</tspan><tspan x="724" dy="17.5">confirmed). Fabric REST import; no data is touched.</tspan></text><rect x="710" y="560" width="440" height="98" rx="10" fill="#fff8e1" stroke="#d4a017" stroke-width="1.6"/><text x="724" y="586" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#6b4e00" font-weight="700" text-anchor="start"><tspan x="724" dy="0">Open point (UNVERIFIED)</tspan></text><text x="724" y="605.75" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="724" dy="0">Whether rayfin up accepts secret names that have no value</tspan><tspan x="724" dy="17.5">yet. Safe order: deploy, secret set, and run rayfin up</tspan><tspan x="724" dy="17.5">again if the CLI regenerates secrets.generated.ts.</tspan></text><rect x="710" y="672" width="440" height="81" rx="10" fill="#ffffff" stroke="#9aa7b4" stroke-width="1.6"/><text x="724" y="698" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#52606d" font-weight="700" text-anchor="start"><tspan x="724" dy="0">Check it</tspan></text><text x="724" y="717.75" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="724" dy="0">npx rayfin --json secret list shows the names set</tspan><tspan x="724" dy="17.5">(values are not shown).</tspan></text><rect x="710" y="767" width="440" height="98" rx="10" fill="#ffffff" stroke="#9aa7b4" stroke-width="1.6"/><text x="724" y="793" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#52606d" font-weight="700" text-anchor="start"><tspan x="724" dy="0">Admin gate</tspan></text><text x="724" y="812.75" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="724" dy="0">startBackup, startRestore and createArchiveFolder check</tspan><tspan x="724" dy="17.5">the server. appRole comes from dynamic claims, or from</tspan><tspan x="724" dy="17.5">ADMIN_SUBJECTS when claims are not minted.</tspan></text></svg>