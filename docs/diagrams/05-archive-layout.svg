<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850"><defs><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#117865"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6fb3"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52606d"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c77700"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b42318"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="30" y="24" width="700" height="520" rx="14" fill="#fff4e0" stroke="#c77700" stroke-width="1.6"/><text x="46" y="50" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#6b3f00" font-weight="700" text-anchor="start"><tspan x="46" dy="0">ADLS GEN2 ARCHIVE  ·  what one backup leaves behind</tspan></text><text x="54" y="84" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, monospace" font-size="13.5" fill="#1f2933" font-weight="500" text-anchor="start" xml:space="preserve" style="white-space:pre"><tspan x="54" dy="0">&lt;container&gt;/</tspan></text><text x="76" y="118" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, monospace" font-size="13.5" fill="#1f2933" font-weight="500" text-anchor="start" xml:space="preserve" style="white-space:pre"><tspan x="76" dy="0">&lt;backup_folder&gt;/</tspan></text><text x="98" y="152" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, monospace" font-size="13.5" fill="#1f2933" font-weight="500" text-anchor="start" xml:space="preserve" style="white-space:pre"><tspan x="98" dy="0">backups/</tspan></text><text x="120" y="186" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, monospace" font-size="13.5" fill="#1f2933" font-weight="700" text-anchor="start" xml:space="preserve" style="white-space:pre"><tspan x="120" dy="0">202611201030/</tspan></text><text x="142" y="220" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, monospace" font-size="13.5" fill="#1f2933" font-weight="500" text-anchor="start" xml:space="preserve" style="white-space:pre"><tspan x="142" dy="0">Tables/</tspan></text><text x="164" y="254" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, monospace" font-size="13.5" fill="#1f2933" font-weight="500" text-anchor="start" xml:space="preserve" style="white-space:pre"><tspan x="164" dy="0">&lt;schema&gt;/</tspan></text><text x="186" y="288" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, monospace" font-size="13.5" fill="#1f2933" font-weight="500" text-anchor="start" xml:space="preserve" style="white-space:pre"><tspan x="186" dy="0">&lt;table&gt;/</tspan></text><text x="208" y="322" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, monospace" font-size="13.5" fill="#1f2933" font-weight="500" text-anchor="start" xml:space="preserve" style="white-space:pre"><tspan x="208" dy="0">_delta_log/</tspan></text><text x="208" y="356" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, monospace" font-size="13.5" fill="#1f2933" font-weight="500" text-anchor="start" xml:space="preserve" style="white-space:pre"><tspan x="208" dy="0">part-*.parquet</tspan></text><text x="142" y="390" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, monospace" font-size="13.5" fill="#1f2933" font-weight="500" text-anchor="start" xml:space="preserve" style="white-space:pre"><tspan x="142" dy="0">Files/</tspan></text><text x="142" y="424" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, monospace" font-size="13.5" fill="#4a2c00" font-weight="700" text-anchor="start" xml:space="preserve" style="white-space:pre"><tspan x="142" dy="0">_manifest/manifest.json</tspan></text><text x="120" y="458" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, monospace" font-size="13.5" fill="#1f2933" font-weight="700" text-anchor="start" xml:space="preserve" style="white-space:pre"><tspan x="120" dy="0">202611210200/ …</tspan></text><text x="352" y="84" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6b7a" font-weight="400" text-anchor="start"><tspan x="352" dy="0">archive_root_uri (the account + container the app allows)</tspan></text><text x="352" y="118" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6b7a" font-weight="400" text-anchor="start"><tspan x="352" dy="0">optional; nested with /, created from the UI</tspan></text><text x="352" y="186" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6b7a" font-weight="400" text-anchor="start"><tspan x="352" dy="0">one folder per backup (UTC minute), never reused</tspan></text><text x="352" y="254" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6b7a" font-weight="400" text-anchor="start"><tspan x="352" dy="0">&quot;dbo&quot; when the lakehouse has no schemas</tspan></text><text x="352" y="288" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6b7a" font-weight="400" text-anchor="start"><tspan x="352" dy="0">one Delta table</tspan></text><text x="352" y="322" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6b7a" font-weight="400" text-anchor="start"><tspan x="352" dy="0">kept, so table history survives</tspan></text><text x="352" y="356" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6b7a" font-weight="400" text-anchor="start"><tspan x="352" dy="0">no _metadata folder</tspan></text><text x="352" y="390" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6b7a" font-weight="400" text-anchor="start"><tspan x="352" dy="0">only if copy_files is on and Files is not empty</tspan></text><text x="352" y="424" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6b7a" font-weight="400" text-anchor="start"><tspan x="352" dy="0">written LAST: present = backup complete</tspan></text><text x="352" y="458" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6b7a" font-weight="400" text-anchor="start"><tspan x="352" dy="0">the next backup, a new folder</tspan></text><rect x="760" y="24" width="410" height="520" rx="14" fill="#f4fbf9" stroke="#117865" stroke-width="1.6"/><text x="776" y="50" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#117865" font-weight="700" text-anchor="start"><tspan x="776" dy="0">_manifest/manifest.json</tspan></text><text x="780" y="66" font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, monospace" font-size="12" fill="#1f2933" font-weight="400" text-anchor="start" xml:space="preserve" style="white-space:pre"><tspan x="780" dy="0">status            &quot;complete&quot;</tspan><tspan x="780" dy="19.5">backup_timestamp  &quot;202611201030&quot;</tspan><tspan x="780" dy="19.5">started_utc, completed_utc</tspan><tspan x="780" dy="19.5">source            workspace_id, lakehouse_id,</tspan><tspan x="780" dy="19.5">                  workspace_name, lakehouse_name,</tspan><tspan x="780" dy="19.5">                  has_schemas</tspan><tspan x="780" dy="19.5">archive_run_root  …/backups/&lt;ts&gt;</tspan><tspan x="780" dy="19.5">copy_method       fastcp_exclude | staged</tspan><tspan x="780" dy="19.5">files_copied      true | false</tspan><tspan x="780" dy="19.5">verify_counts     true | false</tspan><tspan x="780" dy="19.5">tables[]          schema, table, version,</tspan><tspan x="780" dy="19.5">                  numFiles, sizeInBytes, rows?</tspan><tspan x="780" dy="19.5">skipped_shortcuts[]</tspan><tspan x="780" dy="19.5">skipped_non_delta[]</tspan></text><rect x="780" y="360" width="370" height="164" rx="10" fill="#ffffff" stroke="#117865" stroke-width="1.6"/><text x="794" y="387" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#0b5b4d" font-weight="700" text-anchor="start"><tspan x="794" dy="0">Who reads it</tspan></text><text x="794" y="406.75" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="794" dy="0">App (getBackupSet): table list, row counts,</tspan><tspan x="794" dy="17.5">Files flag, source names, completed time.</tspan><tspan x="794" dy="17.5">A 404 means the set is incomplete.</tspan><tspan x="794" dy="17.5">Restore: version, numFiles and sizeInBytes</tspan><tspan x="794" dy="17.5">are checked after every table copy.</tspan><tspan x="794" dy="17.5">Runner: builds the result summary.</tspan></text><rect x="30" y="570" width="1140" height="250" rx="14" fill="#fafafa" stroke="#9aa7b4" stroke-width="1.6"/><text x="46" y="596" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#52606d" font-weight="700" text-anchor="start"><tspan x="46" dy="0">ONELAKE  ·  paths the notebooks touch (always full abfss paths; no default lakehouse is attached)</tspan></text><path d="M54 623 v164 a165.0 11 0 0 0 330 0 v-164 a165.0 11 0 0 0 -330 0z" fill="#f3f4f6" stroke="#52606d" stroke-width="1.6"/><path d="M54 623 a165.0 11 0 0 0 330 0" fill="none" stroke="#52606d" stroke-width="1.6"/><text x="219.0" y="653" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2933" font-weight="700" text-anchor="middle"><tspan x="219.0" dy="0">Source / Target lakehouse</tspan></text><text x="219.0" y="671.75" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6b7a" font-weight="400" text-anchor="middle"><tspan x="219.0" dy="0">backup reads  Tables/&lt;schema&gt;/&lt;table&gt;</tspan><tspan x="219.0" dy="17.25">and Files/  (shortcuts are skipped)</tspan><tspan x="219.0" dy="17.25"> </tspan><tspan x="219.0" dy="17.25">restore writes the same layout:</tspan><tspan x="219.0" dy="17.25">tables are registered with CREATE TABLE</tspan><tspan x="219.0" dy="17.25">… USING DELTA LOCATION; Files top-level</tspan><tspan x="219.0" dy="17.25">items are copied, never overwritten</tspan></text><path d="M412 623 v164 a175.0 11 0 0 0 350 0 v-164 a175.0 11 0 0 0 -350 0z" fill="#f3f4f6" stroke="#52606d" stroke-width="1.6"/><path d="M412 623 a175.0 11 0 0 0 350 0" fill="none" stroke="#52606d" stroke-width="1.6"/><text x="587.0" y="653" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2933" font-weight="700" text-anchor="middle"><tspan x="587.0" dy="0">Staging / control lakehouse</tspan></text><text x="587.0" y="671.75" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6b7a" font-weight="400" text-anchor="middle"><tspan x="587.0" dy="0">Files/backup_staging/&lt;ts&gt;/</tspan><tspan x="587.0" dy="17.25">temporary: capability probe and the staged-copy</tspan><tspan x="587.0" dy="17.25">fallback; removed when the backup ends</tspan><tspan x="587.0" dy="17.25"> </tspan><tspan x="587.0" dy="17.25">Files/rayfin_runs/&lt;runner&gt;/&lt;request_key&gt;.json</tspan><tspan x="587.0" dy="17.25">the result JSON copy; kept</tspan><tspan x="587.0" dy="17.25">(the app reads the job&#x27;s exit value instead)</tspan></text><rect x="790" y="612" width="356" height="186" rx="10" fill="#ffffff" stroke="#9aa7b4" stroke-width="1.6"/><text x="804" y="639" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#52606d" font-weight="700" text-anchor="start"><tspan x="804" dy="0">Guard rails</tspan></text><text x="804" y="658.75" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="804" dy="0">Staging may not equal the source, and the</tspan><tspan x="804" dy="17.5">app refuses it as a restore target.</tspan><tspan x="804" dy="17.5">The result lakehouse may not be the source</tspan><tspan x="804" dy="17.5">(backup) or the target (restore).</tspan><tspan x="804" dy="17.5">Restore never overwrites: items in the way</tspan><tspan x="804" dy="17.5">must be cleaned first, with the exact</tspan><tspan x="804" dy="17.5">lakehouse name typed to confirm.</tspan></text></svg>