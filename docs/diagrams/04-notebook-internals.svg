<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1205" viewBox="0 0 1200 1205"><defs><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#117865"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6fb3"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52606d"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c77700"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b42318"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="30" y="24" width="530" height="915" rx="14" fill="#f5f9fe" stroke="#2f6fb3" stroke-width="1.6"/><text x="46" y="50" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#2f6fb3" font-weight="700" text-anchor="start"><tspan x="46" dy="0">RUNNER NOTEBOOK  ·  nb_backup_run and nb_restore_run (same shape)</tspan></text><rect x="50" y="62" width="490" height="98" rx="10" fill="#eaf1fb" stroke="#2f6fb3" stroke-width="1.6"/><circle cx="70" cy="80.68" r="11" fill="#2f6fb3"/><text x="70" y="85.18" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#fff" font-weight="700" text-anchor="middle"><tspan x="70" dy="0">1</tspan></text><text x="90" y="88" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#2f6fb3" font-weight="700" text-anchor="start"><tspan x="90" dy="0">Parameters cell  (cell tag &quot;parameters&quot;)</tspan></text><text x="90" y="107.75" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="90" dy="0">Defaults that the job request overrides by name. IDs are</tspan><tspan x="90" dy="17.5">GUID text, lists are comma strings, flags are Boolean.</tspan><tspan x="90" dy="17.5">nb_backup_run has 15 parameters, nb_restore_run has 16.</tspan></text><path d="M295.0 160 L295.0 180" fill="none" stroke="#2f6fb3" stroke-width="2" stroke-linejoin="round" marker-end="url(#arb)"/><rect x="50" y="180" width="490" height="81" rx="10" fill="#eaf1fb" stroke="#2f6fb3" stroke-width="1.6"/><circle cx="70" cy="198.68" r="11" fill="#2f6fb3"/><text x="70" y="203.18" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#fff" font-weight="700" text-anchor="middle"><tspan x="70" dy="0">2</tspan></text><text x="90" y="206" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#2f6fb3" font-weight="700" text-anchor="start"><tspan x="90" dy="0">%run nb_backup_restore_adls_v6</tspan></text><text x="90" y="225.75" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="90" dy="0">Loads the engine&#x27;s functions into the session. The item</tspan><tspan x="90" dy="17.5">name must match exactly, in the same workspace.</tspan></text><path d="M295.0 261 L295.0 281" fill="none" stroke="#2f6fb3" stroke-width="2" stroke-linejoin="round" marker-end="url(#arb)"/><rect x="50" y="281" width="490" height="133" rx="10" fill="#eaf1fb" stroke="#2f6fb3" stroke-width="1.6"/><circle cx="70" cy="299.68" r="11" fill="#2f6fb3"/><text x="70" y="304.18" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#fff" font-weight="700" text-anchor="middle"><tspan x="70" dy="0">3</tspan></text><text x="90" y="307" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#2f6fb3" font-weight="700" text-anchor="start"><tspan x="90" dy="0">Shared helpers  (identical in both runners)</tspan></text><text x="90" y="326.75" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="90" dy="0">RunnerError(code, message): a problem the caller can act on.</tspan><tspan x="90" dy="17.5">GUID / boolean / request_key checks, archive address rule,</tspan><tspan x="90" dy="17.5">container probe, _capture() copies engine prints and logs,</tspan><tspan x="90" dy="17.5">_write_result_file() writes the result JSON to the control</tspan><tspan x="90" dy="17.5">lakehouse.</tspan></text><path d="M295.0 414 L295.0 434" fill="none" stroke="#2f6fb3" stroke-width="2" stroke-linejoin="round" marker-end="url(#arb)"/><rect x="50" y="434" width="490" height="116" rx="10" fill="#eaf1fb" stroke="#2f6fb3" stroke-width="1.6"/><circle cx="70" cy="452.68" r="11" fill="#2f6fb3"/><text x="70" y="457.18" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#fff" font-weight="700" text-anchor="middle"><tspan x="70" dy="0">4</tspan></text><text x="90" y="460" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#2f6fb3" font-weight="700" text-anchor="start"><tspan x="90" dy="0">validate_backup_params()  /  validate_restore_params()</tspan></text><text x="90" y="479.75" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="90" dy="0">Every guard runs before anything is written (reads only):</tspan><tspan x="90" dy="17.5">formats, staging ≠ source, lakehouse lookups, container</tspan><tspan x="90" dy="17.5">reachable. Restore also needs a complete manifest and the</tspan><tspan x="90" dy="17.5">exact confirm name when it will delete.</tspan></text><path d="M295.0 550 L295.0 570" fill="none" stroke="#2f6fb3" stroke-width="2" stroke-linejoin="round" marker-end="url(#arb)"/><rect x="50" y="570" width="490" height="168" rx="10" fill="#eaf1fb" stroke="#2f6fb3" stroke-width="1.6"/><circle cx="70" cy="588.68" r="11" fill="#2f6fb3"/><text x="70" y="593.18" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#fff" font-weight="700" text-anchor="middle"><tspan x="70" dy="0">5</tspan></text><text x="90" y="596" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#2f6fb3" font-weight="700" text-anchor="start"><tspan x="90" dy="0">Main block: call the engine, build RESULT</tspan></text><text x="90" y="615.75" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="90" dy="0">backup: backup_lakehouse_to_archive, or reuse a finished</tspan><tspan x="90" dy="17.5">backup when the same backup_timestamp already completed</tspan><tspan x="90" dy="17.5">for this source.</tspan><tspan x="90" dy="17.5">restore: preview_restore, then the real restore if asked.</tspan><tspan x="90" dy="17.5">RunnerError → its error.code; any other error → backup_failed</tspan><tspan x="90" dy="17.5">or restore_failed (modified_target &quot;unknown&quot; if a restore</tspan><tspan x="90" dy="17.5">had started).</tspan></text><path d="M295.0 738 L295.0 758" fill="none" stroke="#2f6fb3" stroke-width="2" stroke-linejoin="round" marker-end="url(#arb)"/><rect x="50" y="758" width="490" height="151" rx="10" fill="#e7f5f2" stroke="#117865" stroke-width="1.6"/><circle cx="70" cy="776.68" r="11" fill="#117865"/><text x="70" y="781.18" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#fff" font-weight="700" text-anchor="middle"><tspan x="70" dy="0">6</tspan></text><text x="90" y="784" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#117865" font-weight="700" text-anchor="start"><tspan x="90" dy="0">Result delivery</tspan></text><text x="90" y="803.75" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="90" dy="0">1. write Files/rayfin_runs/&lt;runner&gt;/&lt;request_key&gt;.json</tspan><tspan x="90" dy="17.5">    (if a control lakehouse was given)</tspan><tspan x="90" dy="17.5">2. print RESULT_JSON &lt;json&gt;</tspan><tspan x="90" dy="17.5">3. failed and fail_on_error: raise RAYFIN_RESULT &lt;json&gt;,</tspan><tspan x="90" dy="17.5">    so the job ends Failed</tspan><tspan x="90" dy="17.5">4. notebookutils.notebook.exit(&lt;json&gt;)</tspan></text><rect x="690" y="24" width="480" height="915" rx="14" fill="#f8f9fc" stroke="#2f6fb3" stroke-width="1.6"/><text x="706" y="50" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#2f6fb3" font-weight="700" text-anchor="start"><tspan x="706" dy="0">ENGINE  ·  nb_backup_restore_adls_v6  (functions only)</tspan></text><rect x="710" y="62" width="440" height="81" rx="10" fill="#eaf1fb" stroke="#2f6fb3" stroke-width="1.6"/><text x="724" y="88" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#2f6fb3" font-weight="700" text-anchor="start"><tspan x="724" dy="0">backup_lakehouse_to_archive()</tspan></text><text x="724" y="107.75" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="724" dy="0">Plan the tables, copy each one, copy Files, write the</tspan><tspan x="724" dy="17.5">manifest last, clean up staging. Raises on any failed check.</tspan></text><rect x="710" y="159" width="440" height="116" rx="10" fill="#eaf1fb" stroke="#2f6fb3" stroke-width="1.6"/><text x="724" y="185" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#2f6fb3" font-weight="700" text-anchor="start"><tspan x="724" dy="0">Restore side</tspan></text><text x="724" y="204.75" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="724" dy="0">preview_restore()  read-only, returns the clashes</tspan><tspan x="724" dy="17.5">clean_target_for_restore()  mode, confirm name, dry_run</tspan><tspan x="724" dy="17.5">restore_from_archive()  cleanup, copy, register, Files</tspan><tspan x="724" dy="17.5">restore_files_from_archive()  top-level Files, no overwrite</tspan></text><rect x="710" y="291" width="440" height="133" rx="10" fill="#ffffff" stroke="#9aa7b4" stroke-width="1.6"/><text x="724" y="317" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9aa7b4" font-weight="700" text-anchor="start"><tspan x="724" dy="0">Copy method</tspan></text><text x="724" y="336.75" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="724" dy="0">exclude_flag_supported()  probes fastcp in the staging</tspan><tspan x="724" dy="17.5">lakehouse</tspan><tspan x="724" dy="17.5">copy_table_without_metadata()  fastcp with</tspan><tspan x="724" dy="17.5">--exclude-path=_metadata, or (fallback) a staged copy that</tspan><tspan x="724" dy="17.5">removes _metadata first</tspan></text><rect x="710" y="440" width="440" height="98" rx="10" fill="#ffffff" stroke="#9aa7b4" stroke-width="1.6"/><text x="724" y="466" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9aa7b4" font-weight="700" text-anchor="start"><tspan x="724" dy="0">Inspect the archive</tspan></text><text x="724" y="485.75" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="724" dy="0">list_archive_backups()  folders, manifest present or not</tspan><tspan x="724" dy="17.5">verify_archive_backup()  re-read tables, compare to manifest</tspan><tspan x="724" dy="17.5">latest_complete_backup()  (the runners do not use it)</tspan></text><rect x="710" y="554" width="440" height="116" rx="10" fill="#ffffff" stroke="#9aa7b4" stroke-width="1.6"/><text x="724" y="580" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9aa7b4" font-weight="700" text-anchor="start"><tspan x="724" dy="0">Helpers</tspan></text><text x="724" y="599.75" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="724" dy="0">lakehouse_root, normalize_archive_uri, check_timestamp,</tspan><tspan x="724" dy="17.5">run_root_of, manifest_path_of, read_json, child_dirs,</tspan><tspan x="724" dy="17.5">delta_state (version, numFiles, size), lakehouse_info,</tspan><tspan x="724" dy="17.5">shortcut_paths, fabric_get (Fabric REST, retries 429 / 5xx)</tspan></text><path d="M540 610 L600 610" stroke="#2f6fb3" stroke-width="2" fill="none"/><path d="M600 610 L600 102 L708 102" fill="none" stroke="#2f6fb3" stroke-width="2" stroke-linejoin="round" marker-end="url(#arb)"/><path d="M600 610 L600 199 L708 199" fill="none" stroke="#2f6fb3" stroke-width="2" stroke-linejoin="round" marker-end="url(#arb)"/><text x="548" y="96" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#1b4a7c" font-weight="600" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan x="548" dy="0">nb_backup_run</tspan></text><text x="548" y="193" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#1b4a7c" font-weight="600" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><tspan x="548" dy="0">nb_restore_run</tspan></text><rect x="30" y="961" width="1140" height="150" rx="10" fill="#fff4e0" stroke="#c77700" stroke-width="1.6"/><text x="44" y="987" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#6b3f00" font-weight="700" text-anchor="start"><tspan x="44" dy="0">Rules the engine follows (each found by testing on the write-once container)</tspan></text><text x="50" y="1013" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="50" dy="0">•  Everything written to the archive goes through fastcp. fs.put and fs.cp fail there and leave empty files that cannot be deleted.</tspan><tspan x="50" dy="18">•  Tables are copied without their _metadata folder (the copy could not be queried through a shortcut). _delta_log, and so time travel, is kept.</tspan><tspan x="50" dy="18">•  The manifest is written last. A backup folder without a manifest is incomplete and restore ignores it.</tspan><tspan x="50" dy="18">•  Nothing in the archive is overwritten or deleted. A failed run stays; the next run uses a new timestamp.</tspan><tspan x="50" dy="18">•  Not covered: shortcuts (skipped, listed in the manifest), anything outside Tables and Files, permissions, SQL endpoint views.</tspan></text><rect x="30" y="1129" width="1140" height="56" rx="10" fill="#ffffff" stroke="#9aa7b4" stroke-width="1.6" stroke-dasharray="6 4"/><text x="46" y="1152" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" font-weight="400" text-anchor="start"><tspan x="46" dy="0"><tspan font-weight="700">Interactive fallback (not used by the app):</tspan> nb_backup_form, nb_restore_form and the two *_executor notebooks keep the original</tspan><tspan x="46" dy="17.5">widget-driven flow. The executors %run the engine and then their form notebook.</tspan></text></svg>